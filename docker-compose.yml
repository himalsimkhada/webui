# Web UI Admin — admin frontend service for the backend modules.
# Copy this file to `.env` and edit the values, then run: docker compose up -d --build
services:
  webui:
    build: .
    container_name: webui-admin
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-change-me}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      PORTAL_MODULES: ${PORTAL_MODULES:-nginx=http://host.docker.internal:8400,bind=http://host.docker.internal:5000}
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-5}
      SERVICE_NAME: webui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s